<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой To-Do лист</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Авторизация -->
    <div id="authPage" class="container auth-container">
        <h1>Вход в To-Do лист</h1>
        
        <div id="loginForm" class="auth-form">
            <div class="form-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" placeholder="example@mail.com">
            </div>
            <div class="form-group">
                <label for="loginPassword">Пароль</label>
                <input type="password" id="loginPassword" placeholder="Введите пароль">
            </div>
            <button id="loginBtn" class="auth-btn">Войти</button>
            <p class="auth-switch">
                Нет аккаунта? <a href="#" id="showRegister">Зарегистрироваться</a>
            </p>
        </div>

        <div id="registerForm" class="auth-form" style="display: none;">
            <div class="form-group">
                <label for="registerName">Имя</label>
                <input type="text" id="registerName" placeholder="Ваше имя">
            </div>
            <div class="form-group">
                <label for="registerEmail">Email</label>
                <input type="email" id="registerEmail" placeholder="example@mail.com">
            </div>
            <div class="form-group">
                <label for="registerPassword">Пароль</label>
                <input type="password" id="registerPassword" placeholder="Минимум 6 символов">
            </div>
            <div class="form-group">
                <label for="registerConfirm">Подтвердите пароль</label>
                <input type="password" id="registerConfirm" placeholder="Повторите пароль">
            </div>
            <button id="registerBtn" class="auth-btn">Зарегистрироваться</button>
            <p class="auth-switch">
                Уже есть аккаунт? <a href="#" id="showLogin">Войти</a>
            </p>
        </div>
    </div>

    <!-- Основная часть -->
    <div id="appPage" style="display: none;">
        <div class="container">
            <div class="header-with-user">
                <h1>Мои задачи</h1>
                <div class="user-info">
                    <span id="userNameDisplay"></span>
                    <button id="logoutBtn" class="logout-btn">Выйти</button>
                </div>
            </div>
            
            <div class="input-section">
                <input type="text" id="taskInput" placeholder="Введите задачу...">
                <button id="addBtn">Добавить</button>
            </div>

            <div class="stats">
                <span>Всего: <span id="totalCount">0</span></span>
                <span>Выполнено: <span id="completedCount">0</span></span>
            </div>

            <ul id="taskList">
                <li class="empty-message">Пока нет задач. Добавьте первую!</li>
            </ul>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="do.js"></script>
</body>
</html>
